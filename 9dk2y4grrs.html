  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 24px}
  .header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px}
  .header-left h1{font-size:22px;font-weight:700;letter-spacing:-0.5px}
  .header-left h1 span{color:var(--accent)}
  .header-left .subtitle{font-size:13px;color:var(--text-dim);margin-top:4px}
  .lang-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .lang-btn{padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s;background:transparent;color:var(--text-muted)}
  .lang-btn.active{background:var(--accent);color:var(--bg)}
  .lang-btn:hover:not(.active){color:var(--text)}
  .date-controls{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .date-controls label{font-size:12px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .date-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 12px;border-radius:8px;outline:none}
  .date-input:focus{border-color:var(--accent)}
  .date-input::-webkit-calendar-picker-indicator{filter:invert(.7)}
  .preset-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
  .preset-btn:hover{border-color:var(--text-muted);color:var(--text)}
  .preset-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .date-divider{color:var(--text-muted);font-size:13px}
  .record-count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);margin-left:auto}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
  .kpi .kl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:6px}
  .kpi .kv{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600}
  .kpi .ks{font-size:11px;color:var(--text-dim);margin-top:4px}
  .section-title{font-size:16px;font-weight:700;margin-bottom:16px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
  .section-title .pill{font-size:11px;font-weight:500;color:var(--text-dim);background:var(--surface2);padding:3px 10px;border-radius:10px}
  .lb-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:28px}
  .lb-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);padding:12px 14px;text-align:left;background:var(--surface2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
  .lb-table th:hover{color:var(--text)}.lb-table th.sorted{color:var(--accent)}
  .lb-table td{font-size:13px;padding:10px 14px;border-bottom:1px solid var(--border)}
  .lb-table tr:last-child td{border-bottom:none}.lb-table tr:hover td{background:var(--surface2)}
  .lb-table .mono{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
  .lb-table .rank{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted)}
  .lb-table .icl-name-cell{font-weight:600;cursor:pointer}.lb-table .icl-name-cell:hover{color:var(--accent)}
  .office-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center}

  .rep-card.inactive{opacity:.5;border-left:3px solid var(--text-muted)}
  .rep-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}

}

function computeAll(s,e){
  const start=new Date(s),end=new Date(e);end.setHours(23,59,59);
  const filtered=RAW.filter(r=>{if(!r.s)return false;const d=new Date(r.s);if(d<start||d>end)return false;if(prodFilter!=='all'&&r.pr!==prodFilter)return false;return true});
  document.getElementById('recordCount').textContent=filtered.length.toLocaleString()+' '+t('orders');
  const tot=filtered.length,c24=filtered.filter(r=>r.c).length;
  const b1d=filtered.filter(r=>r.b1!==null).length,gen=filtered.filter(r=>r.b1!==null);
  const b2d=gen.filter(r=>r.b2!==null).length;
  const campaign={total:tot,cancelRate:tot?+(c24/tot*100).toFixed(1):0,b1DelRate:tot?+(b1d/tot*100).toFixed(1):0,
    b2Rate:gen.length?+(b2d/gen.length*100).toFixed(1):0,b1OnlyPct:gen.length?+((gen.length-b2d)/gen.length*100).toFixed(1):0,
    genuine:gen.length,b2Count:b2d};

  // Per ICL
  const im={};ICL_NAMES.forEach(n=>{im[n]={recs:[],rc:REPS.filter(r=>r.icl===n).length}});
  filtered.forEach(r=>{if(im[r.i])im[r.i].recs.push(r)});
  const iclStats=ICL_NAMES.map(n=>{
    const rr=im[n].recs,tt=rr.length,c=rr.filter(r=>r.c).length,b1=rr.filter(r=>r.b1!==null).length;
    const g=rr.filter(r=>r.b1!==null),b2=g.filter(r=>b2Valid(r)).length;
    return{name:n,reps:im[n].rc,total:tt,cancelRate:tt?+(c/tt*100).toFixed(1):0,b1DelRate:tt?+(b1/tt*100).toFixed(1):0,
      b2Rate:g.length?+(b2/g.length*100).toFixed(1):0,b1OnlyPct:g.length?+((g.length-b2)/g.length*100).toFixed(1):0,genuine:g.length,b2Count:b2}});

  // Per rep
  const rm={};REPS.forEach(r=>{rm[r.name+'||'+r.icl]={...r,recs:[]}});
  filtered.forEach(r=>{const k=r.r+'||'+r.i;if(rm[k])rm[k].recs.push(r)});
  const repStats=REPS.map(rep=>{
    const rr=rm[rep.name+'||'+rep.icl].recs,tt=rr.length;
    if(!tt)return{...rep,total:0,weeks:0,avgB1:0,cancel24h:0,cancelRate:0,b1Del:0,b1DelRate:0,genuine:0,b2:0,b2Rate:0,b1Only:0};
    const wm={};rr.forEach(r=>{wm[r.w]=(wm[r.w]||0)+1});const wk=Object.keys(wm).length;
    const c=rr.filter(r=>r.c).length,b1=rr.filter(r=>r.b1!==null).length;
    const g=rr.filter(r=>r.b1!==null),b2=g.filter(r=>b2Valid(r)).length;
    return{...rep,total:tt,weeks:wk,avgB1:+(tt/wk).toFixed(1),cancel24h:c,cancelRate:tt?+(c/tt*100).toFixed(1):0,
      b1Del:b1,b1DelRate:tt?+(b1/tt*100).toFixed(1):0,genuine:g.length,b2:b2,
      b2Rate:g.length?+(b2/g.length*100).toFixed(1):0,b1Only:g.length?+((g.length-b2)/g.length*100).toFixed(1):0}});
  return{campaign,iclStats,repStats};
}


function b2Valid(r){
  if(r.b2===null||!r.s)return false;
  const s=new Date(r.s);
  const b2s=String(r.b2);
  const b2d=new Date(b2s.slice(0,4)+'-'+b2s.slice(4,6)+'-'+b2s.slice(6,8));
  return(b2d-s)/(86400000)<=84;
}

function render(){
  const s=document.getElementById('startDate').value,e=document.getElementById('endDate').value;
  if(!s||!e)return;
  const{campaign:c,iclStats,repStats}=computeAll(s,e);

  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="kl">${t('total_orders')}</div><div class="kv" style="color:var(--text)">${c.total.toLocaleString()}</div><div class="ks">${c.genuine.toLocaleString()} ${t('genuine_b1')}</div></div>
    <div class="kpi"><div class="kl">${t('cancel_rate')}</div><div class="kv color-${rc(c.cancelRate,'cancel')}">${c.cancelRate}%</div><div class="ks">${t('b2b_avg')}</div></div>
    <div class="kpi"><div class="kl">${t('b1_del_rate')}</div><div class="kv color-blue">${c.b1DelRate}%</div><div class="ks">${t('b2b_avg')}</div></div>
    <div class="kpi"><div class="kl">${t('b2_rate')}</div><div class="kv color-${rc(c.b2Rate,'b2')}">${c.b2Rate}%</div><div class="ks">${t('b2b_avg')}</div></div>
    <div class="kpi"><div class="kl">${t('b1_only')}</div><div class="kv color-${rc(c.b1OnlyPct,'b1only')}">${c.b1OnlyPct}%</div><div class="ks">${(c.genuine-c.b2Count).toLocaleString()} ${t('lost')}</div></div>
    <div class="kpi"><div class="kl">${t('b2_conversions')}</div><div class="kv color-purple">${c.b2Count.toLocaleString()}</div><div class="ks">${t('of')} ${c.genuine.toLocaleString()}</div></div>`;

  // Table
  const active_icls=iclStats.filter(i=>i.total>0);
  document.getElementById('lb_title').innerHTML=`${t('office_rankings')} <span class="pill">${active_icls.length} ${t('offices')}</span>`;
  let sorted=[...iclStats].filter(i=>i.total>0);
  sorted.sort((a,b)=>{let av=a[tblSort],bv=b[tblSort];if(tblSort==='name')return tblDir*av.localeCompare(bv);return tblDir*(av-bv)});
  const cols=[{l:t('rank')},{l:t('icl'),sk:'name'},{l:t('reps_h'),sk:'reps'},{l:t('orders_h'),sk:'total'},
    {l:t('cancel_rate'),sk:'cancelRate'},{l:t('b1_del_rate'),sk:'b1DelRate'},{l:t('b2_rate'),sk:'b2Rate'},{l:t('b1_only'),sk:'b1OnlyPct'}];
  let tb='<thead><tr>'+cols.map(c=>{const cls=c.sk===tblSort?' class="sorted"':'';const oc=c.sk?` onclick="sortTbl('${c.sk}')"`:'';
    const ar=c.sk===tblSort?(tblDir===-1?' ↓':' ↑'):'';return`<th${cls}${oc}>${c.l}${ar}</th>`}).join('')+'</tr></thead><tbody>';
  sorted.forEach((i,idx)=>{tb+=`<tr><td class="rank">${idx+1}</td><td class="icl-name-cell" onclick="toggleOffice('${i.name}')">${i.name}</td>
    <td class="mono">${i.reps}</td><td class="mono">${i.total.toLocaleString()}</td>
    <td class="mono color-${rc(i.cancelRate,'cancel')}">${i.cancelRate}%</td><td class="mono color-blue">${i.b1DelRate}%</td>
    <td class="mono color-${rc(i.b2Rate,'b2')}"><strong>${i.b2Rate}%</strong></td><td class="mono color-${rc(i.b1OnlyPct,'b1only')}">${i.b1OnlyPct}%</td></tr>`});
  tb+='</tbody>';document.getElementById('lbTable').innerHTML=tb;

  // Filters
  document.getElementById('rep_title').innerHTML=`${t('rep_detail')} <span class="pill">${selectedOffices.size>0?selectedOffices.size+' '+t('offices'):t('select_offices')}</span>`;
  let chips=`<div class="office-chip select-all ${selectedOffices.size===ICL_NAMES.length?'selected':''}" onclick="selectAll()">${selectedOffices.size===ICL_NAMES.length?t('clear_all'):t('select_all')}</div>`;
  ICL_NAMES.forEach(n=>{chips+=`<div class="office-chip ${selectedOffices.has(n)?'selected':''}" onclick="togOff('${n}')">${n}</div>`});
  chips+=`<div class="active-toggle"><button class="at-btn ${!activeOnly?'active':''}" onclick="setActive(false)">${t('all_reps')}</button><button class="at-btn ${activeOnly?'active':''}" onclick="setActive(true)">${t('active_only')}</button></div>`;
  document.getElementById('officeFilters').innerHTML=chips;

  if(!selectedOffices.size){
    document.getElementById('noSelection').style.display='block';document.getElementById('noSelection').textContent=t('no_selection');
    document.getElementById('repSortRow').style.display='none';document.getElementById('repGrid').innerHTML='';
    document.getElementById('footnote').innerHTML=t('footnote');return;
  }
  document.getElementById('noSelection').style.display='none';document.getElementById('repSortRow').style.display='flex';
  document.getElementById('repSortRow').innerHTML=`<label>${t('sort_by')}</label>
    <button class="sbtn ${repSort==='volume'?'active':''}" onclick="setSort('volume')">${t('volume')}</button>
    <button class="sbtn ${repSort==='b2rate'?'active':''}" onclick="setSort('b2rate')">${t('b2_rate')}</button>
    <button class="sbtn ${repSort==='cancel'?'active':''}" onclick="setSort('cancel')">${t('cancel')}</button>
    <button class="sbtn ${repSort==='b1only'?'active':''}" onclick="setSort('b1only')">${t('b1_only')}</button>`;

  let reps=repStats.filter(r=>selectedOffices.has(r.icl)&&r.total>0);
  if(activeOnly) reps=reps.filter(r=>r.active!==false);
  if(repSort==='volume')reps.sort((a,b)=>b.total-a.total);
  if(repSort==='b2rate')reps.sort((a,b)=>b.b2Rate-a.b2Rate);
  if(repSort==='cancel')reps.sort((a,b)=>b.cancelRate-a.cancelRate);
  if(repSort==='b1only')reps.sort((a,b)=>b.b1Only-a.b1Only);

  document.getElementById('repGrid').innerHTML=reps.map(r=>{
    const isInactive=r.active===false;
    const isLow=r.total<10&&!isInactive;
    const isFlagged=!isLow&&!isInactive&&r.b2Rate<45;
    const bc=isInactive?'badge-inactive':isLow?'badge-blue':r.b2Rate>=55?'badge-green':r.b2Rate>=45?'badge-amber':'badge-red';
    const bt=isInactive?t('inactive'):isLow?t('low_volume'):r.b2Rate>=55?t('strong'):r.b2Rate>=45?t('monitor'):t('at_risk');
    const cc=isInactive?'inactive':isFlagged?'flagged':isLow?'new-rep':'';
    return`<div class="rep-card ${cc}"><div class="rep-header"><div><div class="rep-name">${r.name}</div><div class="rep-icl">${r.icl}${r.code?' · '+r.code:''}</div>
      <div class="rep-meta">${t('since')} ${r.created} · ${r.weeks} ${t('wks')} · ${r.total} ${t('orders_lc')}</div></div><span class="rep-badge ${bc}">${bt}</span></div>
      <div class="metrics-grid">
        <div class="metric"><div class="ml">${t('avg_b1_wk')}</div><div class="mv" style="color:var(--text)">${r.avgB1}</div><div class="md">${r.total} ${t('total')}</div></div>
        <div class="metric"><div class="ml">${t('cancel_rate')}</div><div class="mv color-${rc(r.cancelRate,'cancel')}">${r.cancelRate}%</div><div class="md">${r.cancel24h} ${t('of').toLowerCase()} ${r.total}</div></div>
        <div class="metric"><div class="ml">${t('b1_del')}</div><div class="mv color-blue">${r.b1DelRate}%</div><div class="md">${r.b1Del} ${t('delivered')}</div></div>
        <div class="metric"><div class="ml">${t('b2_rate')}</div><div class="mv color-${rc(r.b2Rate,'b2')}">${r.b2Rate}%</div><div class="md">${r.b2} ${t('of').toLowerCase()} ${r.genuine}</div></div>
        <div class="metric fw"><div class="ml">${t('b1_only_sales')}</div><div style="display:flex;align-items:center;gap:12px"><div class="mv color-${rc(r.b1Only,'b1only')}">${r.b1Only}%</div><div class="b1-bar-track"><div class="b1-bar-fill" style="width:${r.b1Only}%;background:var(--${rc(r.b1Only,'b1only')})"></div></div></div><div class="md">${r.genuine-r.b2} ${t('no_box2')}</div></div>
      </div></div>`}).join('');
  document.getElementById('footnote').innerHTML=t('footnote');
}

function sortTbl(k){if(tblSort===k)tblDir*=-1;else{tblSort=k;tblDir=k==='name'?1:-1}render()}
function togOff(n){if(selectedOffices.has(n))selectedOffices.delete(n);else selectedOffices.add(n);render()}
function selectAll(){if(selectedOffices.size===ICL_NAMES.length)selectedOffices.clear();else ICL_NAMES.forEach(n=>selectedOffices.add(n));render()}
function setActive(v){activeOnly=v;render()}
function setSort(v){repSort=v;render()}
window.sortTbl=sortTbl;window.togOff=togOff;window.selectAll=selectAll;window.setActive=setActive;window.setSort=setSort;

document.getElementById('startDate').addEventListener('change',()=>{clearP();render()});
document.getElementById('endDate').addEventListener('change',()=>{clearP();render()});
function clearP(){document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'))}
const presets={
    'confirmed':[new Date(Date.now()-135*864e5).toISOString().slice(0,10),new Date(Date.now()-45*864e5).toISOString().slice(0,10)],
    'lastweek':[(()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7-7);return d.toISOString().slice(0,10)})(),(()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7-1);return d.toISOString().slice(0,10)})()],
    'lastmonth':[(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()-1,1).toISOString().slice(0,10)})(),(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),0).toISOString().slice(0,10)})()],
    'all':['2026-03-28','2026-08-23']};
document.querySelectorAll('.preset-btn').forEach(btn=>{btn.addEventListener('click',()=>{
  clearP();btn.classList.add('active');const p=presets[btn.dataset.preset];
  document.getElementById('startDate').value=p[0];document.getElementById('endDate').value=p[1];render()})});

// no default preset active
render();
</script>
</body>
</html>
